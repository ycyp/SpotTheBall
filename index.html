<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SpotTheBall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
  :root{
    --court-navy:#12261e;
    --line-white:#f4efe3;
    --amber:#e8a33d;
    --amber-dim:#c8862a;
    --card-bg:#17322680;
    --muted:#a9c2b4;
    --faint:#7d9a8b;
    --line:#2c5943;
    --tabbar-h:64px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{ height:100%; }
  body{
    background: radial-gradient(ellipse at top, #1c3c2c 0%, var(--court-navy) 60%);
    color:var(--line-white);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100dvh;
  }
  body.app-on{ overflow:hidden; height:100dvh; }
  .wrap{ max-width:640px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; }
  body.app-on .wrap{ height:100dvh; overflow:hidden; }

  header{ text-align:center; padding:20px 16px 12px; flex-shrink:0; }
  body.app-on header{ padding:8px 16px 0; }
  header h1{
    font-family:'Teko', sans-serif; font-weight:700; font-size:44px; line-height:1;
    letter-spacing:2px; color:var(--line-white);
    text-shadow:0 0 18px rgba(232,163,61,0.25);
  }
  body.app-on header h1{ font-size:32px; }
  body.app-on header p, body.app-on .court-line{ display:none; }
  header p{ font-size:12px; color:var(--muted); letter-spacing:1px; }
  .court-line{
    height:2px; margin:12px auto 0; max-width:280px;
    background:repeating-linear-gradient(90deg, var(--line-white) 0 14px, transparent 14px 24px);
    opacity:0.35;
  }

  /* ---------- Auth ---------- */
  #auth-screen{ padding:8px 16px 32px; }
  .auth-card{
    background:var(--card-bg); border:1px solid var(--line); border-radius:14px; padding:24px;
    display:flex; flex-direction:column; gap:12px; backdrop-filter:blur(6px);
  }
  .auth-card h2{ font-family:'Teko',sans-serif; font-size:28px; text-align:center; letter-spacing:1px; }
  .auth-card input{
    background:#0f2018; border:1px solid var(--line); border-radius:8px; padding:11px 12px;
    color:var(--line-white); font-size:15px; font-family:inherit; width:100%;
  }
  .auth-card input:focus{ outline:none; border-color:var(--amber); }
  .auth-card button, .primary-btn{
    background:var(--amber); color:#12261e; border:none; border-radius:8px; padding:11px;
    font-family:'Teko',sans-serif; font-size:20px; font-weight:700; cursor:pointer;
  }
  .auth-card button:hover, .primary-btn:hover{ background:#f2b455; }
  .auth-card button:disabled, .primary-btn:disabled{ opacity:0.6; cursor:default; }
  #auth-error{ color:#e08a72; font-size:13px; min-height:16px; text-align:center; }
  #auth-toggle{ text-align:center; font-size:13px; color:var(--muted); }
  #auth-toggle span{ color:var(--amber); cursor:pointer; text-decoration:underline; }

  /* ---------- App shell ---------- */
  #app-screen{ display:none; flex:1; min-height:0; flex-direction:column; }
  #app-screen.open{ display:flex; }

  .user-bar{
    display:flex; justify-content:space-between; align-items:center;
    padding:0 16px 10px; font-size:12px; color:var(--muted); flex-shrink:0;
  }
  .user-bar button{
    background:none; border:1px solid var(--line); color:var(--muted); padding:5px 11px;
    border-radius:8px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .user-bar button:hover{ border-color:#d9634c; color:#d9634c; }

  .panels{ flex:1; min-height:0; position:relative; }
  .panel{
    display:none; height:100%; overflow:auto;
    padding:0 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 18px);
  }
  .panel.active{ display:flex; flex-direction:column; }
  #panel-map.active{ overflow:hidden; min-height:0; position:relative; }

  .tabbar{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:0; width:100%; max-width:640px;
    display:flex; background:#0d1c16ee; border-top:1px solid var(--line);
    backdrop-filter:blur(10px); padding-bottom:env(safe-area-inset-bottom);
    z-index:40;
  }
  .tabbar button{
    flex:1; background:none; border:none; color:var(--faint);
    padding:10px 0 8px; font-family:inherit; font-size:11px; letter-spacing:.5px;
    cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .tabbar button .ico{ font-size:18px; line-height:1; }
  .tabbar button.active{ color:var(--amber); }

  /* ---------- chips ---------- */
  .chip-row{ display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none; flex-shrink:0; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0; font-size:12px; padding:6px 12px; border-radius:999px;
    border:1px solid var(--line); background:#0f2018; color:var(--muted);
    cursor:pointer; user-select:none; white-space:nowrap;
  }
  .chip.active{ border-color:var(--amber); color:var(--amber); }
  .chip.done-chip.active{ border-color:#7dcea0; color:#7dcea0; }
  .chip.todo-chip.active{ border-color:#8aa; color:#c5d4cc; }

  .progress-bar{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    font-size:13px; color:var(--muted); margin-bottom:8px; flex-shrink:0;
  }
  .progress-bar b{ color:var(--amber); font-size:16px; }
  .legend{ display:none; }
  .legend i{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; }
  .legend .done{ background:var(--amber); }
  .legend .todo{ background:#bbb; filter:grayscale(1); }

  .view-toggle{
    display:flex; flex-shrink:0; background:#0f2018; border:1px solid var(--line);
    border-radius:999px; padding:2px;
  }
  .view-toggle button{
    border:none; background:transparent; color:var(--muted);
    font-family:inherit; font-size:12px; font-weight:700;
    padding:5px 12px; border-radius:999px; cursor:pointer;
  }
  .view-toggle button.active{
    background:var(--amber); color:#12261e;
  }

  .map-stage{
    flex:1; min-height:0; position:relative;
    display:flex; flex-direction:column;
  }
  #overview-map{
    flex:1; min-height:0; border-radius:12px; border:1px solid var(--line);
    overflow:hidden;
  }

  .selected-card{
    display:none; margin-top:8px; background:var(--card-bg); border:1px solid var(--line);
    border-radius:12px; padding:10px 12px; gap:10px; align-items:center; flex-shrink:0;
  }
  .selected-card.show{ display:flex; }
  .selected-card .actions{ display:flex; flex-direction:column; gap:6px; flex-shrink:0; }
  .selected-card .swap{
    background:none; border:1px solid var(--line); color:var(--muted);
    border-radius:8px; padding:6px 10px; font-size:11px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .selected-card img, .selected-card .ph{
    width:56px; height:56px; border-radius:8px; object-fit:cover; flex-shrink:0;
    border:1px solid var(--line);
  }
  .selected-card .ph{
    background:#0f2018; display:flex; align-items:center; justify-content:center;
    font-size:10px; color:var(--faint); text-align:center;
  }
  .selected-card .meta{ flex:1; min-width:0; }
  .selected-card .name{ font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .selected-card .sub{ font-size:11px; color:var(--muted); margin-top:2px; }
  .selected-card .go{
    background:var(--amber); color:#12261e; border:none; border-radius:8px;
    padding:8px 10px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; flex-shrink:0;
  }

  .stad-list{
    display:none; flex:1; min-height:0; margin:0 0 4px;
    overflow:auto; flex-direction:column; gap:6px;
  }

  #panel-map[data-view="map"] .map-stage{ display:flex; }
  #panel-map[data-view="map"] .stad-list{ display:none; }
  #panel-map[data-view="map"] .selected-card.show{
    position:absolute; left:16px; right:16px; margin:0;
    bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 10px);
    z-index:500; backdrop-filter:blur(10px);
  }
  #panel-map[data-view="list"] .map-stage{
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip:rect(0 0 0 0); pointer-events:none;
  }
  #panel-map[data-view="list"] .stad-list{ display:flex; }
  #panel-map[data-view="list"] .selected-card.show{ position:static; }
  .stad-row{
    display:flex; align-items:center; gap:10px; background:var(--card-bg);
    border:1px solid var(--line); border-radius:10px; padding:8px 10px; cursor:pointer;
  }
  .stad-row.picked{ border-color:var(--amber); }
  .stad-row .logo{
    width:28px; height:28px; border-radius:50%; flex-shrink:0; object-fit:contain;
    background:#fff; border:1px solid var(--line);
  }
  .stad-row:not(.conquered) .logo{ filter:grayscale(1) contrast(.9); opacity:.85; }
  .stad-row .n{ flex:1; min-width:0; }
  .stad-row .n .t{ font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stad-row .n .s{ font-size:11px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stad-row .tag{
    font-size:10px; color:#12261e; background:var(--amber); border-radius:999px; padding:2px 7px; font-weight:700;
  }
  .stad-row .tag.wait{ background:#2a4638; color:var(--muted); }

  /* ---------- Form ---------- */
  form{
    background:var(--card-bg); border:1px solid var(--line); border-radius:14px;
    padding:18px; display:flex; flex-direction:column; gap:14px;
    backdrop-filter:blur(6px); margin-top:4px;
  }
  label{
    font-size:11px; letter-spacing:1.5px; color:var(--amber);
    text-transform:uppercase; display:block; margin-bottom:6px;
  }
  input[type=text], input[type=date], select, textarea{
    width:100%; background:#0f2018; border:1px solid var(--line); border-radius:8px;
    padding:11px 12px; color:var(--line-white); font-size:15px; font-family:inherit;
  }
  textarea{
    min-height:148px; line-height:1.65; resize:vertical; font-size:14px;
  }
  select{
    appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%23a9c2b4'><path d='M5.25 7.5L10 12.25 14.75 7.5z'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center; background-size:16px;
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--amber); }
  input[type=file]{ color:var(--muted); font-size:13px; }
  input[type=file]::file-selector-button{
    background:var(--amber-dim); color:#12261e; border:none; padding:8px 14px;
    border-radius:6px; font-weight:700; cursor:pointer; margin-right:10px;
    font-family:'Noto Sans TC', sans-serif;
  }
  #preview-box{ display:none; }
  #preview-box img{
    width:100%; max-height:220px; object-fit:cover; border-radius:8px; border:1px solid var(--line);
  }
  .geo-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .geo-btn{
    background:#0f2018; border:1px solid var(--line); color:var(--line-white);
    padding:9px 14px; border-radius:8px; font-size:13px; cursor:pointer;
    font-family:inherit;
  }
  .geo-btn:hover{ border-color:var(--amber); }
  .geo-status{ font-size:12px; color:var(--faint); }
  button[type=submit]{
    margin-top:4px; background:var(--amber); color:#12261e; border:none; border-radius:8px;
    padding:11px; font-size:22px; font-weight:700; letter-spacing:1px; cursor:pointer;
    font-family:'Teko', sans-serif;
  }
  button[type=submit]:hover{ background:#f2b455; }
  button[type=submit]:disabled{ opacity:0.6; }

  .section-title{
    font-family:'Teko', sans-serif; font-size:24px; letter-spacing:1px;
    margin:4px 0 10px; display:flex; align-items:center; gap:10px;
  }
  .section-title .count{
    font-size:13px; font-family:'Noto Sans TC', sans-serif; color:var(--amber);
    background:#0f2018; border:1px solid var(--line); padding:2px 10px; border-radius:999px;
  }

  #empty-state{
    text-align:center; color:var(--faint); font-size:14px; padding:40px 10px;
    border:1px dashed var(--line); border-radius:12px;
  }
  .checkin-list{ display:flex; flex-direction:column; gap:12px; }
  .checkin-card{
    display:flex; flex-direction:column; gap:8px; background:var(--card-bg); border:1px solid var(--line);
    border-radius:12px; padding:12px;
  }
  .checkin-main{ display:flex; gap:12px; align-items:center; }
  .checkin-card img.photo{
    width:72px; height:72px; object-fit:cover; border-radius:8px; flex-shrink:0; border:1px solid var(--line);
  }
  .checkin-card .no-photo{
    width:72px; height:72px; border-radius:8px; flex-shrink:0; background:#0f2018;
    border:1px dashed var(--line); display:flex; align-items:center; justify-content:center;
    font-size:10px; color:#5d7c6d; text-align:center; padding:2px;
  }
  .checkin-info{ flex:1; min-width:0; }
  .checkin-info .name{
    font-size:15px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .checkin-info .date{ font-size:13px; color:var(--amber); margin-top:2px; }
  .badge{
    font-size:10px; letter-spacing:.5px; color:#12261e; padding:2px 8px;
    border-radius:999px; display:inline-block; margin-top:6px; font-weight:700;
  }
  .card-btns{ display:flex; flex-direction:column; gap:6px; flex-shrink:0; }
  .edit-btn{
    background:none; border:1px solid var(--line); color:var(--amber);
    border-radius:8px; padding:6px 8px; font-size:11px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .edit-btn:hover{ border-color:var(--amber); }
  .delete-btn{
    background:none; border:1px solid #3a5c4c; color:var(--muted); width:100%; height:30px;
    border-radius:8px; cursor:pointer; font-size:16px; line-height:1; flex-shrink:0;
  }
  .delete-btn:hover{ border-color:#d9634c; color:#d9634c; }
  .form-actions{ display:flex; gap:8px; }
  .form-actions button[type=submit]{ flex:1; margin-top:0; }
  #checkin-cancel{
    flex:0 0 auto; background:#0f2018; border:1px solid var(--line); color:var(--muted);
    border-radius:8px; padding:11px 14px; font-size:13px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  #checkin-cancel:hover{ border-color:var(--amber); color:var(--amber); }
  #photo-remove{
    margin-top:8px; background:none; border:1px solid var(--line); color:var(--muted);
    border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; font-family:inherit;
  }

  .checkin-note{
    margin:0; font-size:12px; color:var(--muted); white-space:pre-wrap; font-family:inherit;
    background:#0f2018; border:1px solid var(--line); border-radius:8px; padding:8px 10px; line-height:1.55;
  }
  .stad-marker{ background:none !important; border:none !important; }
  .logo-pin{
    width:34px; height:34px; border-radius:50%; background:#fff;
    box-shadow:0 1px 5px rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center;
    border:2px solid #fff; overflow:hidden;
  }
  .logo-pin.done{ border-color:var(--amber); }
  .logo-pin.todo{ border-color:#c8c8c8; background:#ececec; }
  .logo-pin img{ width:28px; height:28px; object-fit:contain; display:block; }
  .logo-pin.todo img{ filter:grayscale(1) contrast(.92) brightness(1.05); opacity:.88; }

  .leaflet-popup-content{ font-family:'Noto Sans TC', sans-serif; margin:8px 10px !important; }
  .popup-card{ min-width:130px; }
  .popup-card .p-name{ font-weight:700; font-size:13px; }
  .popup-card .p-sub{ font-size:11px; color:#666; margin-top:2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SpotTheBall</h1>
    <p>STADIUM PASSPORT</p>
    <div class="court-line"></div>
  </header>

  <div id="auth-screen">
    <div class="auth-card">
      <h2 id="auth-title">登入</h2>
      <input type="email" id="auth-email" placeholder="Email" autocomplete="email">
      <input type="password" id="auth-password" placeholder="密碼（至少 6 碼）" autocomplete="current-password">
      <button id="auth-submit">登入</button>
      <div id="auth-error"></div>
      <p id="auth-toggle">還沒有帳號？<span id="auth-toggle-link">建立帳號</span></p>
    </div>
  </div>

  <div id="app-screen">
    <div class="user-bar">
      <span id="user-email"></span>
      <button id="logout-btn">登出</button>
    </div>

    <div class="panels">
      <section class="panel active" id="panel-map" data-view="map">
        <div class="chip-row" id="league-chips"></div>
        <div class="chip-row" id="status-chips">
          <div class="chip active" data-status="all">全部場館</div>
          <div class="chip done-chip" data-status="done">已攻略</div>
          <div class="chip todo-chip" data-status="todo">尚未攻略</div>
        </div>
        <div class="progress-bar">
          <div title="彩色＝已攻略，灰色＝尚未攻略">已攻略 <b id="progress-num">0 / 0</b></div>
          <div class="view-toggle" role="tablist" aria-label="地圖或場館">
            <button type="button" role="tab" class="active" data-map-view="map" aria-selected="true">地圖</button>
            <button type="button" role="tab" data-map-view="list" aria-selected="false">場館</button>
          </div>
        </div>
        <div class="map-stage">
          <div id="overview-map"></div>
        </div>
        <div class="stad-list" id="stad-list"></div>
        <div class="selected-card" id="selected-card"></div>
      </section>

      <section class="panel" id="panel-checkin">
        <div class="section-title" id="checkin-title">球場打卡</div>
        <form id="checkin-form">
          <div>
            <label for="league-select">聯盟</label>
            <select id="league-select"></select>
          </div>
          <div>
            <label for="stadium-select">球場</label>
            <select id="stadium-select" required></select>
          </div>
          <div>
            <label for="checkin-date">日期</label>
            <input type="date" id="checkin-date" required>
          </div>
          <div>
            <label for="checkin-note">記事</label>
            <textarea id="checkin-note" spellcheck="false"></textarea>
          </div>
          <div>
            <label>附近球場（選填）</label>
            <div class="geo-row">
              <button type="button" class="geo-btn" id="geo-btn">📍 找出最近的球場</button>
              <span class="geo-status" id="geo-status"></span>
            </div>
          </div>
          <div>
            <label for="photo-input">現場照片（僅存於此裝置）</label>
            <input type="file" id="photo-input" accept="image/*">
            <div id="preview-box">
              <img id="preview-img" alt="照片預覽">
              <button type="button" id="photo-remove">移除照片</button>
            </div>
          </div>
          <div class="form-actions">
            <button type="button" id="checkin-cancel" hidden>取消編輯</button>
            <button type="submit">打卡</button>
          </div>
        </form>
      </section>

      <section class="panel" id="panel-log">
        <div class="section-title">打卡紀錄 <span class="count" id="record-count">0</span></div>
        <div class="chip-row" id="log-league-chips"></div>
        <div id="empty-state">還沒有任何打卡紀錄，開始你的第一座球場吧！</div>
        <div class="checkin-list" id="checkin-list"></div>
      </section>
    </div>

    <nav class="tabbar">
      <button class="active" data-tab="map"><span class="ico">🗺</span>地圖</button>
      <button data-tab="checkin"><span class="ico">📍</span>打卡</button>
      <button data-tab="log"><span class="ico">📒</span>紀錄</button>
    </nav>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword,
    createUserWithEmailAndPassword, signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
    query, where, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import {
    LEAGUES, STADIUMS, stadiumById, stadiumsForLeague, leagueLabel, primaryLeague
  } from "./stadiums.js";
  import {
    stadiumTeam, teamLogoSrc, badgeDataUri, stadiumHomeName
  } from "./teams.js";

  const firebaseConfig = {

  function compressImage(dataUrl){
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const max = 1280;
        const scale = Math.min(1, max / img.width, max / img.height);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });
  }

  function haversineKm(a, b){
    const R = 6371;
    const dLat = (b.lat - a.lat) * Math.PI / 180;
    const dLng = (b.lng - a.lng) * Math.PI / 180;
    const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }

  function renderMap(){
    if(!overviewMap) return;
    if(markerLayer){ overviewMap.removeLayer(markerLayer); }
    markerLayer = L.markerClusterGroup({
      maxClusterRadius: 22,
      disableClusteringAtZoom: mapLeague === 'all' ? 3 : 5,
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false
    });

    const done = conqueredIds();
    const venues = visibleStadiums();
    venues.forEach(s => {
      const conquered = done.has(s.id);
      const marker = L.marker([s.lat, s.lng], { icon: logoPinIcon(s, conquered) });
      marker.on('click', () => selectStadium(s.id, false));
      marker.bindPopup(`
        <div class="popup-card">

        </div>
      `);
      markerLayer.addLayer(marker);

    overviewMap.addLayer(markerLayer);

    const total = stadiumsForLeague(mapLeague).length;
    const got = stadiumsForLeague(mapLeague).filter(s => done.has(s.id)).length;

  // ---------- Geo nearest ----------
  geoBtn.addEventListener('click', () => {
    if(!navigator.geolocation){ geoStatus.textContent = '此瀏覽器不支援定位'; return; }
    geoStatus.textContent = '定位中…';
    navigator.geolocation.getCurrentPosition(pos => {
      const here = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      const ranked = STADIUMS
        .map(s => ({ s, km: haversineKm(here, s) }))
        .sort((a,b) => a.km - b.km);
      const nearest = ranked[0];
      if(!nearest){ geoStatus.textContent = '找不到球場'; return; }
      const league = nearest.s.leagues[0];
      leagueSelect.value = league;
      fillStadiumSelect(league, nearest.s.id);
      const km = nearest.km < 1 ? `${Math.round(nearest.km * 1000)} 公尺` : `${nearest.km.toFixed(1)} 公里`;
      geoStatus.textContent = `最近：${nearest.s.name}（${km}）`;
      applyNoteTemplate(false);
    }, err => {
      geoStatus.textContent = '無法取得位置，請確認已允許定位權限';
      console.error(err);
    }, { enableHighAccuracy:true, timeout:8000 });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const stadiumId = stadiumSelect.value;
    const league = leagueSelect.value;
    const date = dateInput.value;
    const note = noteInput.value.trim();
    const stad = stadiumById(stadiumId);
    if(!stadiumId || !date || !stad) return;

    const payload = {
      stadiumId,
      league,
      name: stad.name,
      date,
      note,
      lat: stad.lat,
      lng: stad.lng
    };

    if(currentUser && currentUser.uid === 'preview'){
      if(!editingId){
        alert('預覽模式不能寫入雲端，請先登入後再打卡');
        return;
      }
      const rec = currentRecords.find(r => r.id === editingId);
      if(rec) Object.assign(rec, payload);
      applyPhotoChange(editingId);
      afterSave(league, stadiumId, 'log');
      render();
      return;
    }

    if(!currentUser){
      return;
    }

    submitBtn.disabled = true;
    try{
      if(editingId){
        await updateDoc(doc(db, 'checkins', editingId), {
          ...payload,
          updatedAt: Date.now()
        });
        applyPhotoChange(editingId);
        afterSave(league, stadiumId, 'log');
      } else {
        const docRef = await addDoc(collection(db, 'checkins'), {
          uid: currentUser.uid,
          ...payload,
          createdAt: Date.now()
        });
        applyPhotoChange(docRef.id);
        afterSave(league, stadiumId, 'map');
      }
    }catch(err){
      alert((editingId ? '儲存失敗：' : '打卡失敗：') + err.message);
      console.error(err);
    }finally{
      submitBtn.disabled = false;
    }
  });

  // ---------- Log list ----------
  function renderLog(){
    const records = logLeague === 'all'
      ? currentRecords
      : currentRecords.filter(r => {
          if(r.league === logLeague) return true;
          const stad = stadiumById(r.stadiumId);
          return stad && stad.leagues.includes(logLeague);
        });

    countBadge.textContent = records.length;
    emptyState.style.display = records.length ? 'none' : 'block';
    list.innerHTML = '';

    records
      .slice()
      .sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.createdAt||0) - (a.createdAt||0))
      .forEach(record => {
        const stad = stadiumById(record.stadiumId);
        const lgId = record.league || stad?.leagues[0] || 'cpbl';
        const lg = LEAGUES[lgId];
        const photo = getLocalPhoto(record.id);
        const card = document.createElement('div');
        card.className = 'checkin-card';
        const media = photo
          ? `<img class="photo" src="${photo}" alt="${escapeHtml(recordTitle(record))}">`
          : `<div class="no-photo">此裝置<br>無照片</div>`;
        const noteHtml = record.note
          ? `<pre class="checkin-note">${escapeHtml(record.note)}</pre>`
          : '';
        card.innerHTML = `
          <div class="checkin-main">
            ${media}
            <div class="checkin-info">
              <div class="name">${escapeHtml(recordTitle(record))}</div>
              <div class="date">${record.date ? formatDate(record.date) : ''}</div>
              <span class="badge" style="background:${lg ? lg.color : '#8b9d94'};">${escapeHtml(lg ? lg.label : '')}</span>
            </div>
            <div class="card-btns">
              <button type="button" class="edit-btn" data-id="${record.id}">編輯</button>
              <button type="button" class="delete-btn" title="刪除" data-id="${record.id}">✕</button>
            </div>
          </div>
          ${noteHtml}
        `;
        list.appendChild(card);
      });

    list.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const record = currentRecords.find(r => r.id === btn.dataset.id);
        startEdit(record);
      });
    });

    list.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        if(currentUser && currentUser.uid === 'preview'){
          currentRecords = currentRecords.filter(r => r.id !== id);
          removeLocalPhoto(id);
          if(editingId === id) exitEdit(true);
          render();
          return;
        }
        try{
          await deleteDoc(doc(db, 'checkins', id));
          removeLocalPhoto(id);
          if(editingId === id) exitEdit(true);
        }catch(err){
          alert('刪除失敗：' + err.message);
        }
      });
    });
  }

  function onMapLeague(id){
    mapLeague = id;
    renderLeagueChips(leagueChips, mapLeague, onMapLeague, true);
    renderMap();
    renderStadList();
    renderSelectedCard();
  }

  function onLogLeague(id){
    logLeague = id;
    renderLeagueChips(logLeagueChips, logLeague, onLogLeague, true);
    renderLog();
  }

  function render(){
    renderLeagueChips(leagueChips, mapLeague, onMapLeague, true);
    renderLeagueChips(logLeagueChips, logLeague, onLogLeague, true);
    renderMap();
    renderStadList();
    renderSelectedCard();
    renderLog();
  }
</script>
</body>
</html>
